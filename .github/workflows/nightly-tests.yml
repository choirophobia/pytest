name: Nightly API Test Suite

"on":
  schedule:
    # 06:00 WIB (UTC+7) == 23:00 UTC the previous day
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        id: run_tests
        continue-on-error: true
        run: pytest -v --json-report --json-report-file=report.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.json
          retention-days: 14

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/notify_discord.py report.json

      - name: Ensure the nightly-failure label exists
        if: steps.run_tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create nightly-failure --repo "$GITHUB_REPOSITORY" \
            --color d73a4a --description "Nightly CI run against DummyJSON failed" --force

      - name: File or update tracking issue on failure
        if: steps.run_tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly-failure --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Still failing as of run #${GITHUB_RUN_NUMBER}: ${RUN_URL}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Nightly test suite failed ($(date -u +%Y-%m-%d))" \
              --label nightly-failure \
              --body "The nightly pytest run against DummyJSON failed. See the run for details: ${RUN_URL}"
          fi

      - name: Close tracking issue if the suite is green again
        if: steps.run_tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly-failure --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Suite passed again as of run #${GITHUB_RUN_NUMBER}: ${RUN_URL}. Closing."
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Fail workflow if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
